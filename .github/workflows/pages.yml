name: Deploy to GitHub Pages

# Publica o app como site estático.
#
# Requer que Pages esteja habilitado no repositório com "Source: GitHub Actions"
# (Settings → Pages). Em repositório privado, Pages exige plano pago.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas para publicar em Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build static export
        env:
          PAGES_EXPORT: '1'
          # Pages de projeto serve em https://<user>.github.io/<repo>/
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Disable Jekyll
        # Sem isto, o Jekyll do Pages ignora o diretório _next/
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
